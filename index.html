<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wife Application – Emre’s Rules</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--bgg:linear-gradient(160deg,#fff1f4,#ffdfe8 60%,#ffeede);--card:#fffafb;--ink:#3d1f2c;--mut:#92596d;--acc:#d6336c;--acc2:#fff;--line:#f5c3d2;--bad:#b3261e;--fld:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bgg:linear-gradient(160deg,#1c1016,#2b1420 60%,#2a1a1a);--card:#2f1a26;--ink:#ffe9ef;--mut:#d8a6b8;--acc:#ff6b9d;--acc2:#2b0f1b;--line:#5c3044;--bad:#ff9a8f;--fld:#24131c;color-scheme:dark}}
:root[data-theme="dark"]{--bgg:linear-gradient(160deg,#1c1016,#2b1420 60%,#2a1a1a);--card:#2f1a26;--ink:#ffe9ef;--mut:#d8a6b8;--acc:#ff6b9d;--acc2:#2b0f1b;--line:#5c3044;--bad:#ff9a8f;--fld:#24131c;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px);min-height:100%}
body{margin:0;min-height:100vh;background:var(--bgg);background-attachment:fixed;color:var(--ink);font:17px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:620px;margin:0 auto;padding:22px 16px 56px;position:relative;z-index:1}
h1{font:700 1.9rem/1.2 "Playfair Display",Georgia,serif;margin:6px 0 4px;text-align:center;color:var(--acc)}
.sub{color:var(--mut);font-size:.98rem;margin:0 0 18px;text-align:center}
.bar{height:10px;background:var(--line);border-radius:99px;overflow:hidden;margin-bottom:18px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#ff8fab,var(--acc));border-radius:99px;width:0;transition:width .4s}
.card{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:24px 20px;box-shadow:0 10px 30px rgba(214,51,108,.15);animation:pop .35s ease}
@keyframes pop{from{opacity:0}to{opacity:1}}
.part{color:var(--acc);font-weight:700;font-size:.85rem;letter-spacing:.03em;margin:0 0 8px}
.q{font:600 1.3rem/1.35 "Playfair Display",Georgia,serif;margin:0 0 8px}
.hint{color:var(--mut);font-size:.95rem;margin:0 0 14px}
.hint strong{color:var(--ink);font-size:1.05em}
textarea,input{width:100%;font:inherit;color:var(--ink);background:var(--fld);border:2px solid var(--line);border-radius:14px;padding:13px}
textarea:focus,input:focus{outline:none;border-color:var(--acc)}
textarea{min-height:140px;resize:vertical}
.opts{display:grid;gap:10px;margin-top:10px}
.opt,.btn{font:inherit;border-radius:99px;border:2px solid var(--line);background:var(--fld);color:var(--ink);padding:14px 18px;text-align:center;cursor:pointer;transition:transform .12s,border-color .12s}
.opt:hover,.btn:hover{border-color:var(--acc);transform:translateY(-1px)}
.opt.sel{border-color:var(--acc);background:var(--line)}
.row{display:flex;gap:10px;margin-top:20px}
.btn{flex:1;font-weight:600}
.btn.pri{background:var(--acc);color:var(--acc2);border-color:var(--acc);box-shadow:0 6px 16px rgba(214,51,108,.3)}
.err{color:var(--bad);font-size:.92rem;min-height:1.2em;margin:10px 0 0}
pre{white-space:pre-wrap;background:var(--fld);border:2px solid var(--line);border-radius:14px;padding:12px;font:.85rem/1.45 ui-monospace,Menlo,monospace;max-height:260px;overflow:auto}
.fl{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.fl span{position:absolute;bottom:-40px;opacity:.35;animation:up linear infinite}
@keyframes up{to{transform:translateY(-115vh) rotate(20deg)}}
@media (prefers-reduced-motion:reduce){.fl{display:none}.card{animation:none}}
.prof{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-start}
.pimg{width:132px;height:176px;object-fit:cover;object-position:50% 25%;border-radius:18px;border:3px solid var(--line);box-shadow:0 6px 16px rgba(214,51,108,.25);cursor:zoom-in}
.pinfo{flex:1;min-width:170px}.pinfo h2{font:700 1.3rem "Playfair Display",Georgia,serif;margin:0 0 2px;color:var(--acc)}
.pr{margin:0 0 3px;font-size:.92rem}.pabout{margin:14px 0 18px;padding-top:14px;border-top:2px dashed var(--line)}
.lb{position:fixed;inset:0;background:rgba(20,5,12,.88);display:flex;align-items:center;justify-content:center;z-index:50;cursor:zoom-out;animation:pop .25s ease}
.lb img{max-width:94vw;max-height:92vh;border-radius:14px}.lbx{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));right:18px;color:#fff;font-size:1.6rem}
.kiss{text-align:center;position:relative;margin-bottom:10px}.kb{font-size:4.2rem;animation:kb 1.6s ease-in-out infinite}
@keyframes kb{0%,100%{transform:scale(1) rotate(-6deg)}50%{transform:scale(1.25) rotate(6deg)}}
.kiss span{position:absolute;bottom:10px;font-size:1.4rem;animation:kf 2.4s ease-out infinite}
@keyframes kf{from{opacity:1;transform:translateY(0)}to{opacity:0;transform:translateY(-110px) scale(1.4)}}
@media (prefers-reduced-motion:reduce){.kb,.kiss span{animation:none}}
.pimg{width:96px;height:128px}.prof{flex-wrap:nowrap;align-items:center}.pinfo{min-width:0}.pinfo h2{font-size:1.15rem}
.more{margin:10px 0 8px;border:2px solid var(--line);border-radius:14px;padding:8px 12px}.more summary{cursor:pointer;font-weight:600;color:var(--acc)}.more .pr{margin-top:6px}
.st .sub,.st .bar{display:none}.st h1{font-size:1.5rem;margin:0 0 8px}.st .card{padding:16px}.st main{padding-top:12px}.st .row{margin-top:10px}
main{padding-bottom:calc(88px + env(safe-area-inset-bottom,0px))}
.card{padding:20px 18px}.q{font-size:1.2rem}.hint{margin-bottom:10px;font-size:.92rem}
.opts{gap:8px;margin-top:8px}.opt,.btn{padding:12px 16px}.row{margin-top:14px}
textarea{min-height:112px}pre{max-height:120px;font-size:.8rem}
.more .pr{font-size:.85rem;margin:4px 0}.more .hint{font-size:.85rem;margin:8px 0 2px}
.grid{display:grid;grid-template-columns:1fr 1fr}.grid .btn{padding:11px 8px;font-size:.92rem}
.kb{font-size:3rem}.kiss{margin-bottom:4px}
.stick{position:sticky;bottom:0;background:var(--card);padding:8px 0 calc(8px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);margin-top:8px}
@media (max-height:720px){h1{font-size:1.5rem}.pimg{width:84px;height:112px}.card{padding:16px 14px}.q{font-size:1.1rem}.opt,.btn{padding:10px 14px}}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}.chip{font:inherit;border-radius:99px;border:2px solid var(--line);background:var(--fld);color:var(--ink);padding:9px 14px;cursor:pointer}.chip.sel{border-color:var(--acc);background:var(--line);font-weight:600}
.cal{margin-bottom:12px}.calh{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.calnav{border:2px solid var(--line);background:var(--fld);color:var(--ink);border-radius:99px;width:40px;height:34px;font-size:1.2rem;cursor:pointer}.calnav:disabled{opacity:.3;cursor:default}
.calg{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.cald{text-align:center;font-size:.72rem;color:var(--mut)}
.calc{font:inherit;border:2px solid transparent;background:var(--fld);color:var(--ink);border-radius:10px;padding:7px 0;cursor:pointer}.calc:disabled{opacity:.25;background:transparent;cursor:default}.calc.sel{background:var(--acc);color:var(--acc2);font-weight:700}
.chip:disabled{opacity:.5;text-decoration:line-through;cursor:default}
</style>
</head>

const card=document.getElementById("card"),pb=document.getElementById("pb");
let hist=[],cur="START",A={},lock=false;
const valid=id=>id==="START"||id==="STOP"||id==="DONE"||!!Q[id];
function save(){try{localStorage.setItem("wa",JSON.stringify({A,hist,cur}))}catch(e){}}
function el(t,c,x){const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}
function maxDob(){const d=new Date();d.setFullYear(d.getFullYear()-18);const p=n=>String(n).padStart(2,"0");return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate())}
function calPick(box,get,set){
  const t0=new Date();t0.setHours(0,0,0,0);
  const mn=new Date(t0);mn.setDate(mn.getDate()+2);const mx=new Date(t0);mx.setDate(mx.getDate()+90);
  const sd=get()?new Date(get()+"T00:00:00"):mn;let vy=sd.getFullYear(),vm=sd.getMonth();
  const iso=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
  const draw=()=>{
    box.textContent="";
    const head=el("div","calh"),pv=el("button","calnav","‹"),nx=el("button","calnav","›");
    const first=new Date(vy,vm,1),last=new Date(vy,vm+1,0);
    pv.disabled=new Date(vy,vm,0)<mn;nx.disabled=new Date(vy,vm+1,1)>mx;
    pv.onclick=()=>{vm--;if(vm<0){vm=11;vy--}draw()};nx.onclick=()=>{vm++;if(vm>11){vm=0;vy++}draw()};
    head.append(pv,el("b",null,first.toLocaleDateString("en-GB",{month:"long",year:"numeric"})),nx);box.append(head);
    const g=el("div","calg");["Mon","Tue","Wed","Thu","Fri","Sat","Sun"].forEach(n=>g.append(el("span","cald",n)));
    for(let i=0;i<(first.getDay()+6)%7;i++)g.append(el("span"));
    for(let d=1;d<=last.getDate();d++){
      const dt=new Date(vy,vm,d),wk=dt.getDay()===0||dt.getDay()===6,inr=wk&&dt>=mn&&dt<=mx,full=inr&&isFull(iso(dt)),ok=inr&&!full;
      const b=el("button","calc"+(get()===iso(dt)?" sel":""),full?"✕":String(d));b.disabled=!ok;
      b.onclick=()=>{set(iso(dt));draw()};g.append(b)}
    box.append(g);
  };draw();
}
function ty0(l){return l==="Date of birth"?"date":""}
function rich(t){const p=el("p","hint");t.split("**").forEach((x,i)=>{if(i%2){const b=document.createElement("strong");b.textContent=x;p.append(b)}else p.append(x)});return p}
function go(id){if(lock)return;lock=true;setTimeout(()=>lock=false,350);hist.push(cur);cur=id;save();render()}
function back(){if(lock)return;lock=true;setTimeout(()=>lock=false,350);if(hist.length){cur=hist.pop();save();render()}}
function render(){
  window.scrollTo(0,0);if(!valid(cur)){cur="START";hist=[]}card.textContent="";document.body.classList.toggle("st",cur==="START");
  pb.style.width=Math.min(100,hist.length/30*100)+"%";
  if(cur==="START")return start();
  if(cur==="STOP")return stop();
  if(cur==="DONE")return done();
  const q=Q[cur];
  card.append(el("p","part",q.p),el("p","q",(/^\d/.test(cur)?"Q"+cur+". ":"")+q.t));
  if(q.h)card.append(rich(q.h));
  const err=el("p","err");
  const nav=(next)=>{const r=el("div","row");if(hist.length){const b=el("button","btn","← Back");b.onclick=back;r.append(b)}if(next)r.append(next);card.append(r,err)};
  if(q.k==="yn"||q.k==="ch"){
    const list=q.k==="yn"?[["Yes",q.y],["No",q.n]]:q.o,box=el("div","opts");
    list.forEach(([l,to])=>{const b=el("button","opt"+(A[cur]===l?" sel":""),(l==="Yes"?"💖 ":l==="No"?"🌸 ":"")+l);b.onclick=()=>{if(lock)return;A[cur]=l;go(to)};box.append(b)});
    card.append(box);nav();
  }else if(q.k==="sched"){
    const o0=A[cur]||{};let iso0=o0._iso||"",tm=o0["Time (UK time)"]||"";
    const grp=(title,list,get,set)=>{card.append(el("p","hint",title));const box=el("div","chips");list.forEach(v=>{const c=el("button","chip"+(get()===v?" sel":""),v);c.onclick=()=>{set(v);[...box.children].forEach(x=>x.classList.toggle("sel",x.textContent===v))};box.append(c)});card.append(box)};
    card.append(el("p","hint","Choose a Saturday or Sunday (✕ means already booked)"));const cb=el("div","cal");card.append(cb);
    card.append(el("p","hint","Time (UK time)"));const tb=el("div","chips");card.append(tb);
    const drawT=()=>{tb.textContent="";SLOTS.forEach(v=>{const bk=BOOKED.includes(iso0+"|"+v);const c=el("button","chip"+(tm===v&&!bk?" sel":""),bk?"✕ "+v+" (booked)":v);c.disabled=bk;c.onclick=()=>{tm=v;drawT()};tb.append(c)})};drawT();
    calPick(cb,()=>iso0,v=>{iso0=v;if(BOOKED.includes(iso0+"|"+tm))tm="";drawT()});
    const b=el("button","btn pri","Book my time 💕");
    b.onclick=()=>{if(!iso0||!tm||BOOKED.includes(iso0+"|"+tm)){err.textContent="Please choose a weekend date and a time.";return}A[cur]={"Day":new Date(iso0+"T00:00:00").toLocaleDateString("en-GB",{weekday:"long",day:"numeric",month:"long",year:"numeric"}),"Time (UK time)":tm,_iso:iso0};go(q.nx)};
    nav(b);
  }else if(q.k==="form"){
    const fs=q.f.map(([l,ty,rq])=>{const w=el("div");w.style.marginBottom="12px";w.append(el("p","hint",l));const i=el("input");i.type=ty;if(ty==="date"){i.max=maxDob();i.min="1920-01-01"}i.value=(A[cur]||{})[l]||"";w.append(i);card.append(w);return[l,i,rq]});
    const b=el("button","btn pri","Next 💕");
    b.onclick=()=>{const o={};for(const[l,i,rq]of fs){const v=i.value.trim();if(rq&&!v){err.textContent="Please fill in: "+l;return}if(ty0(l)==="date"&&v>maxDob()){err.textContent="You must be at least 18 years old to apply.";return}if(l.startsWith("Phone")&&v.replace(/\D/g,"").length<7){err.textContent="Please enter a valid phone number.";return}if(l.startsWith("Email")&&!/^\S+@\S+\.\S+$/.test(v)){err.textContent="Please enter a valid email address.";return}o[l]=v}A[cur]=o;go(q.nx)};nav(b);
  }else{
    const f=q.k==="ta"?el("textarea"):el("input");if(q.k!=="ta")f.type="text";
    f.value=A[cur]||"";f.setAttribute("aria-label",q.t);card.append(f);
    const b=el("button","btn pri","Next 💕");
    b.onclick=()=>{const v=f.value.trim();if(!v&&!q.opt){err.textContent="Please answer this question to continue.";return}A[cur]=v;go(q.nx)};
    nav(b);
  }
}
function profile(){
  const box=el("div"),w=el("div","prof"),im=el("img","pimg");im.src=PHOTO;im.alt="Emre. Tap to enlarge.";im.tabIndex=0;
  const open=()=>{const o=el("div","lb"),b=el("img");b.src=PHOTO;b.alt="Emre";o.append(b,el("span","lbx","✕"));o.onclick=()=>o.remove();document.body.append(o)};
  im.onclick=open;im.onkeydown=e=>{if(e.key==="Enter")open()};
  const t=el("div","pinfo");t.append(el("h2",null,"Hello, I’m Emre 👋"),el("p","pr","Working student · BSc Computer Science"),el("p","hint","Tap my photo to enlarge 📸"));
